# Desenvolvimento local: só o banco. App com "npm start" na máquina.
name: financas-dev

services:
  db:
    image: postgres:15-alpine
    container_name: db_financas
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: financas
    ports:
      - "15432:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d financas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dev_pgdata:
